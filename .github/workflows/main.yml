          { echo "==== error 行 ===="; cat /tmp/errs.txt; echo; echo "==== 结尾 80 行 ===="; tail -80 /tmp/build.log; } > "$GITHUB_WORKSPACE/v33-编译错误.txt"

          exit "$RC"

      # ============================================================
      # 6 打 ipa：两种压缩方式各出一份（TrollStore / 全能签 都能读）
      #   - 严格按 ipa 规范：Payload/xxx.app/...
      #   - 不带任何 macOS 垃圾（__MACOSX / 资源分支 / 扩展属性）
      #   - 去掉 ad-hoc 签名残留，巨魔那边不用再处理
      #   - 打完立刻用 Python 真解压一遍回验（CRC 全校验），坏包当场拦住
      # ============================================================
      - name: 6 打 ipa（两份 + 真解压回验）
        env:
          SRC: ${{ steps.locate.outputs.SRC }}
        run: |
          set -eu
          APP=$(find "$SRC/build/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::没编出 .app"
            grep -E "error:" /tmp/build.log | head -40 || true
            exit 1
          fi
          echo "产物：$APP"
          ls -la "$APP" | head -20

          echo "==== 6.1 清掉签名残留（巨魔要的是干净未签名包）===="
          find "$APP" -name "_CodeSignature" -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find "$APP" -name "CodeResources" -type f -delete 2>/dev/null || true
          find "$APP" -name "embedded.mobileprovision" -type f -delete 2>/dev/null || true
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          codesign --remove-signature "$APP/$EXE" 2>/dev/null || true
          echo "  已清理，主程序：$EXE"

          echo "==== 6.2 按规范搭 Payload ===="
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg/Payload
          cp -R "$APP" /tmp/pkg/Payload/
          find /tmp/pkg -name "__MACOSX" -prune -exec rm -rf {} + 2>/dev/null || true
          find /tmp/pkg -name ".DS_Store" -delete 2>/dev/null || true

          PL=$(find /tmp/pkg -maxdepth 3 -name Info.plist | wc -l | tr -d ' ')
          [ "$PL" = "1" ] && echo "  ✅ 正好一份 Info.plist" || { echo "::error::Info.plist 数量=$PL"; exit 1; }
          APPIN=/tmp/pkg/Payload/$(basename "$APP")
          [ -f "$APPIN/Info.plist" ] && echo "  ✅ Payload/xxx.app/Info.plist" || { echo "::error::结构不对"; exit 1; }
          [ -f "$APPIN/$EXE" ] && echo "  ✅ 主程序与 plist 对得上：$EXE" || { echo "::error::主程序对不上"; exit 1; }
          [ -f "$APPIN/splash.mp4" ] && echo "  ✅ ipa 里有启动视频" || { echo "::error::ipa 里没视频"; exit 1; }
          [ -f "$APPIN/splashWide.mp4" ] && echo "  ✅ ipa 里有横版启动视频" || { echo "::error::ipa 里没横版视频"; exit 1; }

          echo "==== 6.3 打包 + 回验 ===="
          python3 - "$APPIN" "$EXE" <<'PY'
          import os, sys, zipfile, hashlib, shutil, json

          root = '/tmp/pkg'
          appin, exe = sys.argv[1], sys.argv[2]

          entries = []          # (kind, arcsname, fullpath, mode)
          for dirpath, dirnames, filenames in os.walk(root):
              dirnames.sort(); filenames.sort()
              rel = os.path.relpath(dirpath, root).replace(os.sep, '/')
              if rel != '.':
                  entries.append(('d', rel + '/', None, 0o40755))
              for fn in filenames:
                  p = os.path.join(dirpath, fn)
                  r = os.path.relpath(p, root).replace(os.sep, '/')
                  st = os.lstat(p)
                  if os.path.islink(p):
                      entries.append(('l', r, p, 0o120777))
                  else:
                      mode = 0o100755 if (st.st_mode & 0o111) else 0o100644
                      entries.append(('f', r, p, mode))

          print('  条目数：%d' % len(entries))

          def build(out, method):
              with zipfile.ZipFile(out, 'w', method, allowZip64=False) as z:
                  for kind, name, path, mode in entries:
                      if kind == 'd':
                          zi = zipfile.ZipInfo(name)
                          zi.external_attr = (mode << 16) | 0x10
                          zi.create_system = 3
                          z.writestr(zi, b'')
                      elif kind == 'l':
                          zi = zipfile.ZipInfo(name)
                          zi.external_attr = mode << 16
                          zi.create_system = 3
                          z.writestr(zi, os.readlink(path).encode())
                      else:
                          with open(path, 'rb') as f:
                              data = f.read()
                          zi = zipfile.ZipInfo(name)
                          zi.external_attr = mode << 16
                          zi.create_system = 3
                          z.writestr(zi, data, compress_type=method)

          outputs = [
              ('/tmp/langshen-v33.2-unsigned.ipa', zipfile.ZIP_DEFLATED),
              ('/tmp/langshen-v33.2-store.ipa',   zipfile.ZIP_STORED),
          ]
          for out, method in outputs:
              build(out, method)
              # 回验：真读一遍 + 全校验 CRC，坏包当场拦住
              with zipfile.ZipFile(out) as z:
                  bad = z.testzip()
                  assert bad is None, 'CRC 坏文件：%s' % bad
                  names = z.namelist()
                  assert 'Payload/' in names, '缺 Payload/'
                  plist = 'Payload/%s/Info.plist' % os.path.basename(appin)
                  assert plist in names, '缺 %s' % plist
                  assert 'Payload/%s/%s' % (os.path.basename(appin), exe) in names, '缺主程序'
                  assert not any(n.startswith('__MACOSX') for n in names), '有 __MACOSX'
                  assert not any(n.startswith('.') for n in names), '有隐藏垃圾文件'
                  h = hashlib.sha256(open(out, 'rb').read()).hexdigest()
              size = os.path.getsize(out)
              print('  ✅ %s  %d 字节  %.1f MB' % (os.path.basename(out), size, size/1024/1024))
              print('     sha256 %s' % h)
          print('  两种压缩方式都通过回验')
          PY

          cp /tmp/langshen-v33.2-unsigned.ipa /tmp/langshen-v33.2-store.ipa "$GITHUB_WORKSPACE/"
          ls -lh "$GITHUB_WORKSPACE"/langshen-v33.2-*.ipa

          {
            echo "## ✅ 两个 ipa 都打好了"
            echo ""
            echo '```'
            shasum -a 256 "$GITHUB_WORKSPACE"/langshen-v33.2-unsigned.ipa "$GITHUB_WORKSPACE"/langshen-v33.2-store.ipa
            echo '```'
            echo ""
            echo "- 先装 \`langshen-v33.2-unsigned.ipa\`（标准包，全能签 / TrollStore 都认）"
            echo "- 万一某个工具报「提取失败」，换 \`langshen-v33.2-store.ipa\`（同内容，不压缩存储，最笨的读取器也能读）"
            echo ""
            echo "下载后可以先核对上面这两个 sha256，文件不完整就是下载被截断了。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 7 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: langshen-v33.2-ipa
          path: |
            langshen-v33.2-unsigned.ipa
            langshen-v33.2-store.ipa
          if-no-files-found: error

      - name: 8 出错时补打一遍日志结尾
        if: failure()
        run: |
          echo "==== error 行 ===="
          grep -E "error: " /tmp/build.log | sort -u | head -30 || echo "（没有 error 行）"
          echo "==== 结尾 60 行 ===="
          tail -60 /tmp/build.log || true

      - name: 9 出错时把错误清单传上来
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v33-编译错误
          path: v33-编译错误.txt
          if-no-files-found: ignore
