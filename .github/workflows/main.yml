          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme OGIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build > /tmp/build.log 2>&1
          RC=$?
